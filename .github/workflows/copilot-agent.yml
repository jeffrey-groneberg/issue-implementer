name: Copilot Issue Agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  copilot-requests: write

# Issue events get read-only cache access by default; the action saves each issue's
# Copilot session in the cache so later runs can resume it.
cache-mode: write

concurrency:
  group: copilot-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent:
    # Skip runner start-up for events the agent ignores anyway; the action re-checks everything.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'copilot')
      || (github.event_name == 'issue_comment' && !github.event.issue.pull_request
          && (contains(github.event.issue.labels.*.name, 'copilot')
              || contains(github.event.issue.labels.*.name, 'copilot:plan')
              || contains(github.event.issue.labels.*.name, 'copilot:working')
              || contains(github.event.issue.labels.*.name, 'copilot:failed')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The agent's sandbox has no network, so install what the tests need first.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r requirements.txt pytest

      - name: Copilot Issue Agent
        uses: ./
        with:
          max-ai-credits: '300'
